<!doctype html>
<!-- Template for the 1200×630 link-preview image. Rendered by: node tools/make-images.mjs share -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..700&family=Caveat:wght@500;700&display=block">
<style>
  :root{--ink:#0A0C12;--paper:#F3F1F7;--mute:#A2A1B3;--violet:#B24EE8}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:"Google Sans Flex","Figtree",system-ui,sans-serif}
  .card{position:relative;width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column}
  .logo{height:38px;width:237px;align-self:flex-start;display:block}
  h1{margin-top:auto;font-weight:400;font-size:84px;line-height:1.0;letter-spacing:-.045em;max-width:8.6em}
  h1 span{color:var(--violet)}
  p{margin-top:26px;font-size:28px;line-height:1.3;color:var(--mute);letter-spacing:-.01em}
  .hand{position:absolute;top:66px;right:78px;font-family:"Caveat",cursive;font-size:44px;color:var(--violet);transform:rotate(-6deg)}
  .sketch{position:absolute;right:28px;bottom:-60px;width:390px;opacity:.9}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><!--LOGO--></defs></svg>
<div class="card">
  <svg class="logo" viewBox="0 0 899 144"><use href="#logo"/></svg>
  <span class="hand">Lisbon, PT</span>
  <img class="sketch" src="../images/hero-sketch.png" alt="">
  <h1>Hands-on design workshops <span>in Lisbon</span></h1>
  <p>Taught by practitioners, not professors. Open to anyone.</p>
</div>
</body>
</html>
